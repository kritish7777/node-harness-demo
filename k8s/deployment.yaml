apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: node-demo

  template:
    metadata:
      labels:
        app: node-demo

    spec:
      containers:
      - name: node-demo

        image: kritish7777/node-harness-demo:<+artifact.tag>

        ports:
        - containerPort: 3000
